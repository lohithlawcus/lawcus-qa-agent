version: 1
id: auth.password_masked
feature: authentication
suite: login-essentials
name: Keep the password concealed
layer: ui
risk: low
status: approved

steps:
  - primitive: auth.open_login_page
    input:
      page: "${ctx.page}"
      origin: "${ctx.origin}"
  - primitive: auth.ensure_login_fields
    input:
      page: "${ctx.page}"
    saveAs: fields

assertions:
  - primitive: auth.assert_password_masked
    input:
      password: "${fields.password}"
