version: 1
id: auth.invalid_password
feature: authentication
suite: login-essentials
name: Reject an incorrect password
layer: ui
risk: low
status: approved

steps:
  - primitive: auth.open_login_page
    input:
      page: "${ctx.page}"
      origin: "${ctx.origin}"
  - primitive: auth.ensure_login_fields
    input:
      page: "${ctx.page}"
    saveAs: fields
  - primitive: auth.fill_credentials
    input:
      email: "${fields.email}"
      password: "${fields.password}"
      credentials:
        email: "qa@example.test"
        password: "Incorrect-fixture-value"
  - primitive: auth.resolve_submit_control
    input:
      page: "${ctx.page}"
      aliases: "${ctx.aliases}"
    saveAs: submit

assertions:
  - primitive: auth.assert_invalid_credentials_rejected
    input:
      page: "${ctx.page}"
  - primitive: auth.assert_protected_route_blocked
    input:
      page: "${ctx.page}"
      origin: "${ctx.origin}"
