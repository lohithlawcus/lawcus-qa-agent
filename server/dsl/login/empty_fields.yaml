version: 1
id: auth.empty_fields
feature: authentication
suite: login-essentials
name: Keep empty credentials out
layer: ui
risk: low
status: approved

steps:
  - primitive: auth.open_login_page
    input:
      page: "${ctx.page}"
      origin: "${ctx.origin}"
  - primitive: auth.ensure_login_fields
    input:
      page: "${ctx.page}"
    saveAs: fields
  - primitive: auth.resolve_submit_control
    input:
      page: "${ctx.page}"
      aliases: "${ctx.aliases}"
    saveAs: submit

assertions:
  - primitive: auth.assert_empty_fields_blocked
    input:
      page: "${ctx.page}"
      email: "${fields.email}"
      password: "${fields.password}"
