version: 1
id: auth.logout
feature: authentication
suite: login-essentials
name: Sign out and invalidate the session
layer: ui
risk: low
status: approved

# assert_authenticated_workspace runs as a step (not an assertion) because
# it must happen strictly before the logout action, not after every step —
# the DSL runs setup, then steps, then assertions, then cleanup in that
# fixed order, so an assertion required mid-sequence belongs in `steps`.
steps:
  - primitive: auth.open_login_page
    input:
      page: "${ctx.page}"
      origin: "${ctx.origin}"
  - primitive: auth.ensure_login_fields
    input:
      page: "${ctx.page}"
    saveAs: fields
  - primitive: auth.fill_credentials
    input:
      email: "${fields.email}"
      password: "${fields.password}"
      credentials:
        email: "qa@example.test"
        password: "Fixture-only-123!"
  - primitive: auth.resolve_submit_control
    input:
      page: "${ctx.page}"
      aliases: "${ctx.aliases}"
    saveAs: submit
  - primitive: auth.assert_authenticated_workspace
    input:
      page: "${ctx.page}"
  - primitive: auth.logout
    input:
      page: "${ctx.page}"

assertions:
  - primitive: auth.assert_protected_route_blocked
    input:
      page: "${ctx.page}"
      origin: "${ctx.origin}"
